<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sᴧɴᴅᴇᴇᴘ sʜᴧʀᴍᴧ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="navbar">
    <a href="#home">Home</a>
    <a href="#features">Features</a>
    <a href="#" onclick="toggleContact()">Contact</a>
  </div>

  <div class="hero" id="home">
    <h1>sᴧɴᴅᴇᴇᴘ sʜᴧʀᴍᴧ</h1>
    <p>ꜰᴏᴜɴᴅᴇʀ ᴏꜰ ᴛᴇᴀᴍ ᴊᴀᴘᴀɴᴇꜱᴇ</p>
  </div>

  <div class="contact-form" id="contact">
    <span class="close-btn" onclick="toggleContact()">✖</span>
    <h2>Contact Me</h2>
    <form action="https://formsubmit.co/sandeepshrmadev@gmail.com" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <input type="text" name="subject" placeholder="Subject" required>
      <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <div class="background-animation"></div>

  <script src="script.js"></script>
</body>
</html>
